version: 2
unit_tests:
- name: daily_metrics_and_large_share
  model: mart_daily_state_metrics
  given:
  - input: ref('stg_transactions')
    rows:
    - {transaction_date: '2020-01-01', state: NY, amount: 100, amount_bucket: MEDIUM}
    - {transaction_date: '2020-01-01', state: NY, amount: 1000, amount_bucket: LARGE}
    - {transaction_date: '2020-01-01', state: CA, amount: 20, amount_bucket: SMALL}
  expect:
    rows:
    - {transaction_date: '2020-01-01', state: NY, transaction_count: 2, total_amount: 1100,
      average_amount: 550, p95_amount: 1000, large_transaction_share: 50}
    - {transaction_date: '2020-01-01', state: CA, transaction_count: 1, total_amount: 20,
      average_amount: 20, p95_amount: 20, large_transaction_share: 0}
- name: category_fraud_metrics
  model: mart_fraud_by_category
  given:
  - input: ref('stg_transactions')
    rows:
    - {category: food, amount: 10, target: 0}
    - {category: food, amount: 30, target: 1}
    - {category: travel, amount: 5, target: 0}
  expect:
    rows:
    - {category: food, transaction_count: 2, fraud_count: 1, fraud_rate: 50, total_amount: 40,
      fraud_amount: 30}
    - {category: travel, transaction_count: 1, fraud_count: 0, fraud_rate: 0, total_amount: 5,
      fraud_amount: 0}
- name: state_distinct_customers_and_merchants
  model: mart_fraud_by_state
  given:
  - input: ref('stg_transactions')
    rows:
    - {state: DC, customer_key: a, merchant: x, amount: 10, target: 0}
    - {state: DC, customer_key: a, merchant: x, amount: 20, target: 1}
    - {state: DC, customer_key: b, merchant: y, amount: 30, target: 0}
  expect:
    rows:
    - {state: DC, transaction_count: 3, fraud_count: 1, customer_count: 2, merchant_count: 2,
      total_amount: 60, fraud_amount: 20}
- name: customer_risk_and_history
  model: mart_customer_risk_profile
  given:
  - input: ref('stg_transactions')
    rows:
    - {customer_key: high, transaction_time: '2020-01-01 10:00:00', transaction_date: '2020-01-01',
      amount: 10, target: 1}
    - {customer_key: high, transaction_time: '2020-01-02 11:00:00', transaction_date: '2020-01-02',
      amount: 30, target: 0}
    - {customer_key: medium, transaction_time: '2020-01-01 10:00:00', transaction_date: '2020-01-01',
      amount: 10, target: 1}
    - {customer_key: medium, transaction_time: '2020-01-01 11:00:00', transaction_date: '2020-01-01',
      amount: 10, target: 0}
    - {customer_key: medium, transaction_time: '2020-01-01 12:00:00', transaction_date: '2020-01-01',
      amount: 10, target: 0}
    - {customer_key: low, transaction_time: '2020-01-01 10:00:00', transaction_date: '2020-01-01',
      amount: 5, target: 0}
  expect:
    rows:
    - customer_key: high
      risk_level: HIGH
      transaction_count: 2
      average_amount: 20
      first_transaction_time: '2020-01-01 10:00:00'
      last_transaction_time: '2020-01-02 11:00:00'
      active_days: 2
    - customer_key: medium
      risk_level: MEDIUM
      transaction_count: 3
      average_amount: 10
      first_transaction_time: '2020-01-01 10:00:00'
      last_transaction_time: '2020-01-01 12:00:00'
      active_days: 1
    - customer_key: low
      risk_level: LOW
      transaction_count: 1
      average_amount: 5
      first_transaction_time: '2020-01-01 10:00:00'
      last_transaction_time: '2020-01-01 10:00:00'
      active_days: 1
  overrides:
    vars:
      high_risk_rate: 50
- name: hourly_weighted_overall_rate
  model: mart_hourly_fraud_pattern
  given:
  - input: ref('stg_transactions')
    rows:
    - {weekday: 1, hour: 0, amount: 10, target: 1}
    - {weekday: 1, hour: 1, amount: 10, target: 0}
    - {weekday: 1, hour: 1, amount: 10, target: 0}
    - {weekday: 1, hour: 1, amount: 10, target: 0}
  expect:
    rows:
    - {weekday: 1, hour: 0, fraud_rate: 100, overall_fraud_rate: 25, is_high_risk: 1}
    - {weekday: 1, hour: 1, fraud_rate: 0, overall_fraud_rate: 25, is_high_risk: 0}
- name: merchant_suspicion_boundaries
  model: mart_merchant_analytics
  given:
  - input: ref('stg_transactions')
    rows:
    - {merchant: enough, amount: 10, target: 1}
    - {merchant: enough, amount: 30, target: 0}
    - {merchant: few, amount: 20, target: 1}
    - {merchant: below, amount: 10, target: 1}
    - {merchant: below, amount: 10, target: 0}
    - {merchant: below, amount: 10, target: 0}
    - {merchant: below, amount: 10, target: 0}
    - {merchant: clean, amount: 5, target: 0}
    - {merchant: clean, amount: 5, target: 0}
  expect:
    rows:
    - {merchant: enough, transaction_count: 2, fraud_rate: 50, total_amount: 40, is_suspicious: 1}
    - {merchant: few, transaction_count: 1, fraud_rate: 100, total_amount: 20, is_suspicious: 1}
    - {merchant: below, transaction_count: 4, fraud_rate: 25, total_amount: 40, is_suspicious: 0}
    - {merchant: clean, transaction_count: 2, fraud_rate: 0, total_amount: 10, is_suspicious: 0}
  overrides:
    vars:
      suspicious_rate: 50
- name: daily_p95_is_not_maximum
  model: mart_daily_state_metrics
  given:
  - input: ref('stg_transactions')
    format: sql
    rows: |
      select
          toDate('2020-01-01') as transaction_date,
          'NY' as state,
          toDecimal64(number + 1, 2) as amount,
          'SMALL' as amount_bucket
      from numbers(21)
  expect:
    rows:
    - {transaction_date: '2020-01-01', state: NY, p95_amount: 20}
